[tool.poetry]
name = "boxes-builds"
package-mode = false
version = "0.1.0"
description = "Record of boxes built with florianfesti's boxes"
authors = ["Seth Fischer <seth@fischer.nz>"]
license = "MIT"
readme = "README.rst"

[tool.poetry.dependencies]
python = "^3.12"
boxes = {git = "https://github.com/florianfesti/boxes.git", rev = "84e392b39191d81db6d381bf1c20a7fc6ae0c8ce"}
invoke = "^3.0.3"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
isort = "^9.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
